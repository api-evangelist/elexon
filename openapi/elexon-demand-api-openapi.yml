openapi: 3.2.0
info:
  title: Insights.Api Demand API
  version: '1.0'
  description: GB electricity demand, including historic.
servers:
- url: https://data.elexon.co.uk/bmrs/api/v1
tags:
- name: Demand
  description: GB electricity demand, including historic.
paths:
  /demand/by-restoration-zone/restored/submissions:
    get:
      tags:
      - Demand
      summary: Restoration Zone Demand Restored Submissions (RZDR)
      description: 'This endpoint provides data about the end of system restoration events. It returns the restored demand value

        for each restoration zone at the last submission time of each event. The number of events to return is

        determined by the `count` parameter.


        The data can be filtered by submission date/time, region, and GSP Group ID (when received by NESO).


        All DateTimes should be expressed as defined within

        RFC 3339.


        Some examples of parameter combinations are shown below.


        Filtering latest 3 events:


        /demand/by-restoration-zone/restored/submissions?count=3


        Filtering latest 3 events before a given submission time:


        /demand/by-restoration-zone/restored/submissions?before=2025-10-01T00:00Z&count=3


        Filtering latest 10 events for a given region:


        /demand/by-restoration-zone/restored/submissions?region=North West&count=10'
      parameters:
      - name: count
        in: query
        description: The number of system restoration events to return.
        required: true
        schema:
          type: integer
          format: int32
          example: 3
          x-max-events-count: 10
        example: 3
      - name: before
        in: query
        description: 'If specified, filters events to those with a submission time before or at the specified date and time.

          If omitted, latest events are returned.'
        schema:
          type: string
          format: date-time
      - name: region
        in: query
        description: The region to filter by.
        schema:
          enum:
          - North Scotland
          - South Scotland
          - North West
          - North East
          - Midlands
          - South West
          - South East
          type: string
      - name: gspGroupId
        in: query
        description: The GSP Group ID to filter by.
        schema:
          type: string
      - name: format
        in: query
        description: Response data format. Use json/xml to include metadata.
        schema:
          enum:
          - json
          - xml
          - csv
          type: string
      responses:
        '200':
          description: Data retrieved
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.RestorationZone.RestorationZoneDemandRestoredDatasetRow'
            application/json:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.RestorationZone.RestorationZoneDemandRestoredDatasetRow'
            text/json:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.RestorationZone.RestorationZoneDemandRestoredDatasetRow'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.RestorationZone.RestorationZoneDemandRestoredDatasetRow'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.RestorationZone.RestorationZoneDemandRestoredDatasetRow'
            text/csv:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.RestorationZone.RestorationZoneDemandRestoredDatasetRow'
        '429':
          description: Too many requests
        '400':
          description: Error with query parameters - see response for details
        '500':
          description: Server error - please try again later
      operationId: getDemandByRestorationZoneRestoredSubmissions
      x-operation-id-source: derived
  /demand/outturn:
    get:
      tags:
      - Demand
      summary: Initial National Demand outturn (INDO)
      description: 'This endpoint provides data for Initial National Demand Outturn, which measures the

        half-hour average MW demand metered by the Transmission Company based on its operational metering.

        The data is updated every 30 minutes and within 15 minutes of the end of the effective settlement period. The data is represented with:

        - INDO (initial National Demand outturn) which takes into account transmission losses but does not include station transformer load, pumped storage demand or interconnector demand.

        - ITSDO (initial Transmission System Demand outturn) which takes into account transmission losses, station transformer load, pumped storage demand and interconnector demand.


        This endpoint is useful for ad-hoc querying of the data.


        Settlement date parameters must be provided in the exact format yyyy-MM-dd.'
      parameters:
      - name: settlementDateFrom
        in: query
        description: The settlement date from for the filter. This must be in the format yyyy-MM-dd.
        schema:
          type: string
          format: date
          example: '2022-09-20'
        example: '2022-09-20'
      - name: settlementDateTo
        in: query
        description: The settlement date to for the filter. This must be in the format yyyy-MM-dd.
        schema:
          type: string
          format: date
          example: '2022-09-21'
        example: '2022-09-21'
      - name: settlementPeriod
        in: query
        schema:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int32
      - name: format
        in: query
        description: Response data format. Use json/xml to include metadata.
        schema:
          enum:
          - json
          - xml
          - csv
          type: string
      responses:
        '200':
          description: Data retrieved
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
            application/json:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
            text/json:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
            text/csv:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
        '429':
          description: Too many requests
        '400':
          description: Error with query parameters - see response for details
        '500':
          description: Server error - please try again later
      operationId: getDemandOutturn
      x-operation-id-source: derived
  /demand/outturn/stream:
    get:
      tags:
      - Demand
      summary: Initial National Demand outturn (INDO) stream
      description: 'This endpoint provides data for initial National Demand outturn, which measures the

        half-hour average MW demand metered by the Transmission Company based on its operational metering.

        The data is updated every 30 minutes and within 15 minutes of the end of the effective settlement period. The data is represented with:

        - INDO (initial National Demand outturn) which takes into account transmission losses but does not include station transformer load, pumped storage demand or interconnector demand.

        - ITSDO (initial Transmission System Demand outturn) which takes into account transmission losses, station transformer load, pumped storage demand and interconnector demand.


        This endpoint has an optimised JSON payload and is aimed at frequent requests for the data.


        Settlement date parameters must be provided in the exact format yyyy-MM-dd.'
      parameters:
      - name: settlementDateFrom
        in: query
        description: The settlement date from for the filter. This must be in the format yyyy-MM-dd.
        schema:
          type: string
          format: date
          example: '2022-09-20'
        example: '2022-09-20'
      - name: settlementDateTo
        in: query
        description: The settlement date to for the filter. This must be in the format yyyy-MM-dd.
        schema:
          type: string
          format: date
          example: '2022-09-21'
        example: '2022-09-21'
      - name: settlementPeriod
        in: query
        schema:
          uniqueItems: true
          type: array
          items:
            type: integer
            format: int32
      responses:
        '200':
          description: Data retrieved
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insights.Api.Models.Responses.DemandOutturn.DemandOutturn'
        '429':
          description: Too many requests
        '400':
          description: Error with query parameters - see response for details
        '500':
          description: Server error - please try again later
      operationId: getDemandOutturnStream
      x-operation-id-source: derived
  /demand/outturn/daily:
    get:
      tags:
      - Demand
      summary: Initial National Demand outturn per day (INDOD)
      description: 'This endpoint provides initial National Demand outturn data per day. The total daily energy volume is the total

        demand volume for the previous day expressed on an initial National Demand outturn (INDO) basis, i.e. excluding

        station transformer, pumping and interconnector export demand. It is calculated from summing the half hourly

        INDO demands (divided by two to convert to MWh).


        If no date window is chosen, the search will default to results from the last 31 days.


        This API endpoint has a maximum range of 2 years (731 days).'
      parameters:
      - name: settlementDateFrom
        in: query
        schema:
          type: string
          format: date
          example: '2023-08-26'
        example: '2023-08-26'
      - name: settlementDateTo
        in: query
        schema:
          type: string
          format: date
          example: '2023-08-27'
        example: '2023-08-27'
      - name: format
        in: query
        description: Response data format. Use json/xml to include metadata.
        schema:
          enum:
          - json
          - xml
          - csv
          type: string
      responses:
