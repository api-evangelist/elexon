  /demand/peak/indicative:
    get:
      tags:
      - Demand
      summary: Indicative peak demand per day (S0142, ITSDO, FUELHH)
      description: 'Indicative demand peaks using operational metering data are daily maxima values determined from

        ITSDO and FUELHH data used to determine and visualise Triad.


        Indicative demand peaks using settlement metering data are daily maxima values determined from

        metered volume data from the S0142_bpi file. These peaks are not used for Triad visualisation as

        they are always calculated based on the latest run type. Triads for settlement data

        remain static after the National Grid report posted at the beginning of April after the Triad season has ended.


        If no filters are supplied, results default to the latest or current Triad season.

        To specify a custom filter, you can supplier EITHER a Triad season start year, OR a date range, but not both.

        If a Triad Season Start year is supplied, data for the Triad season beginning on 1 November

        of the specified year will be returned.

        If a date range is supplied, data will be returned for settlement dates within the date range inclusively.


        Date parameters must be provided in the exact format yyyy-MM-dd.'
      parameters:
      - name: data
        in: query
        description: The type of data. Supports values of 'operational' or 'settlement'.
        required: true
        schema:
          enum:
          - operational
          - settlement
          type: string
          example: operational
        example: operational
      - name: triadSeasonStartYear
        in: query
        description: A year indicating the Triad season starting on 1 November of the given year, e.g. 2021.
        schema:
          type: integer
          format: int32
      - name: from
        in: query
        description: The start of the requested date range.
        schema:
          type: string
          format: date
          example: '2021-10-01'
        example: '2021-10-01'
      - name: to
        in: query
        description: The end of the requested date range.
        schema:
          type: string
          format: date
          example: '2021-10-30'
        example: '2021-10-30'
      - name: format
        in: query
        description: Response data format. Use json/xml to include metadata.
        schema:
          enum:
          - json
          - xml
          - csv
          type: string
      responses:
        '200':
          description: Data retrieved
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.IndicativeDemandPeak'
            application/json:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DemandOutturn.IndicativeDemandPeak'
            text/json:
