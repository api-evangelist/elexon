  /demand/peak:
    get:
      tags:
      - Demand
      summary: Peak demand per day (ITSDO)
      description: 'This endpoint allows for retrieving peak ITSDO demand for each day from National Grid ESO.

        Results are filtered by a range of Date parameters.

        Results default to yesterday''s peak if no parameters are supplied.


        Date parameters must be provided in the exact format yyyy-MM-dd.'
      parameters:
      - name: from
        in: query
        description: The start of the requested date range.
        schema:
          type: string
          format: date
          example: '2021-10-01'
        example: '2021-10-01'
      - name: to
        in: query
