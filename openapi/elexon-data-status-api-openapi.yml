  /data-status/ISPSTACK:
    get:
      tags:
      - Data Status
      summary: Status of ingested ISPSTACK Data
      description: 'This endpoint provides information about the number of data points ingested for the ISPSTACK dataset.


        The settlementDateFrom and settlementDateTo query parameters are optional. If they''re not provided, the endpoint

        will return data for up to the last 25 Settlement Periods, including the current one.'
      parameters:
      - name: settlementDateFrom
        in: query
        description: The settlement date from filter. This must be in the format yyyy-MM-dd.
        schema:
          type: string
          format: date
          example: '2022-09-20'
        example: '2022-09-20'
      - name: settlementDateTo
        in: query
        description: The settlement date to filter. This must be in the format yyyy-MM-dd.
        schema:
          type: string
          format: date
          example: '2022-09-21'
        example: '2022-09-21'
      - name: format
        in: query
        description: Response data format. Use json/xml to include metadata.
        schema:
          enum:
          - json
          - xml
          - csv
          type: string
      responses:
        '200':
          description: Data retrieved
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.DataStatus.DataStatusResponse'
            application/json:
