openapi: 3.2.0
info:
  title: Insights.Api Data Status API
  version: '1.0'
  description: The number of datapoints ingested for a dataset in a given period of time, grouped by settlement period.
servers:
- url: https://data.elexon.co.uk/bmrs/api/v1
