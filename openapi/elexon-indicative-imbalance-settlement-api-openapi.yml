      summary: Settlement calculation summary (ISPSTACK, DISEBSP, MID, NETBSAD)
      description: 'Returns the settlement calculation summary for the requested settlement period.

        Data is derived from the following datasets: ISPSTACK, DISEBSP, MID, NETBSAD


        In JSON format, decimal values are returned as strings to avoid loss of precision.'
      parameters:
