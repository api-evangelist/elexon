  /forecast/margin/daily/evolution:
    get:
      tags:
      - Margin Forecast
      summary: Evolution daily margin forecast (OCNMFD2)
      description: 'This endpoint provides the daily evolution Generating Plant Operating Margin covering 2 days ahead to 14 days ahead in MW values.

        The Daily API outputs the latest published data for daily margin forecast for D+2 to D+14.


        Date parameter must be provided in the exact format yyyy-MM-dd.'
      parameters:
      - name: forecastDate
        in: query
        description: The forecast date for the filter. This must be in the format yyyy-MM-dd.
        required: true
        schema:
          type: string
          format: date
          example: '2022-09-20'
        example: '2022-09-20'
      - name: format
        in: query
        description: Response data format. Use json/xml to include metadata.
        schema:
          enum:
          - json
          - xml
          - csv
          type: string
      responses:
        '200':
