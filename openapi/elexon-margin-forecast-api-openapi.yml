      x-operation-id-source: derived
  /forecast/margin/weekly:
    get:
      tags:
      - Margin Forecast
      summary: Weekly margin forecast (OCNMFW2, OCNMF3Y2)
      description: 'This endpoint provides the Generating Plant Operating Margin covering 2 weeks ahead to 156 weeks ahead in MW values.

