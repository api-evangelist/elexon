    get:
      tags:
      - Margin Forecast
      summary: Historical daily margin forecast (OCNMFD2)
      description: 'This endpoint provides the historic Generating Plant Operating Margin covering 2 days ahead to 14 days ahead in MW values.

        The historic API outputs the latest published data for historic daily margin forecast for D+2 to D+14'
      parameters:
