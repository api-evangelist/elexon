openapi: 3.2.0
info:
  title: Insights.Api Margin Forecast API
  version: '1.0'
  description: Generating Plant Operating Margin forecast data, including historical views of data by publish time or forecast date.
servers:
- url: https://data.elexon.co.uk/bmrs/api/v1
tags:
- name: Margin Forecast
  description: Generating Plant Operating Margin forecast data, including historical views of data by publish time or forecast date.
paths:
  /forecast/margin/daily:
    get:
      tags:
      - Margin Forecast
      summary: Daily margin forecast (OCNMFD2)
      description: 'This endpoint provides the Generating Plant Operating Margin covering 2 days ahead to 14 days ahead

        in MW values. The Daily API outputs the latest published data for daily margin forecast for D+2 t D+14'
      parameters:
      - name: format
        in: query
        description: Response data format. Use json/xml to include metadata.
        schema:
          enum:
          - json
          - xml
          - csv
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.ForecastMargin.ForecastMarginDaily'
            application/json:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.ForecastMargin.ForecastMarginDaily'
            text/json:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.ForecastMargin.ForecastMarginDaily'
            application/xml:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.ForecastMargin.ForecastMarginDaily'
            text/xml:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.ForecastMargin.ForecastMarginDaily'
            text/csv:
              schema:
                $ref: '#/components/schemas/Insights.Api.Models.Responses.ResponseWithMetadata-1_Insights.Api.Models.Responses.ForecastMargin.ForecastMarginDaily'
      operationId: getForecastMarginDaily
      x-operation-id-source: derived
